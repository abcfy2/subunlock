[project]
name = "subunlock"
version = "0.1.0"
description = "Extract standard Clash subscriptions from modified proxy clients"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "cryptography>=50.0.2",
]

[project.scripts]
subunlock = "subunlock.cli:main"

[dependency-groups]
dev = ["ruff>=0.17.4", "basedpyright>=1.40.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subunlock"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Provider.configure_args is an optional no-op (no args by default); B027 does not apply.
"src/subunlock/base.py" = ["B027"]

[tool.basedpyright]
include = ["src", "main.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
