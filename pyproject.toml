[project]
name = "subunlock"
version = "0.1.0"
description = "Extract standard Clash subscriptions from modified proxy clients"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "cryptography>=50.0.2",
    "pydantic>=2.14.3",
]

[project.scripts]
subunlock = "subunlock.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["ruff>=0.17.4", "basedpyright>=1.40.2", "fastapi>=0.162.2", "fastapi-cli>=0.0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subunlock"]

[tool.fastapi]
entrypoint = "subunlock.server:app"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "RUF"]

[tool.basedpyright]
include = ["src", "main.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
