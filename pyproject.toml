[project]
name = "subunlock"
version = "0.1.0"
description = "Extract standard Clash subscriptions from modified proxy clients"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    # Floor must stay satisfiable by Pyodide's bundled cryptography (47.0.0)
    # for Cloudflare Python Workers; uv.lock keeps latest (50.0.2) locally.
    "cryptography>=47.0.0",
    "pydantic>=2.14.3",
]

[project.scripts]
subunlock = "subunlock.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["ruff>=0.17.4", "basedpyright>=1.40.2", "fastapi>=0.162.2", "fastapi-cli>=0.0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subunlock"]

[tool.fastapi]
entrypoint = "subunlock.server:app"

[tool.vercel]
# Dotted src spelling resolves to src/subunlock/server.py (root-relative file
# check); relative imports inside resolve via the src namespace package.
entrypoint = "src.subunlock.server:app"

# Vercel's default install runs `uv sync --no-dev`, which skips extras.
# Override it to install the server extra (fastapi) so the REST entrypoint
# loads; flags mirror the runtime default minus --no-dev.
[tool.vercel.scripts]
install = "uv sync --frozen --extra server --no-editable"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "RUF"]

[tool.basedpyright]
include = ["src", "main.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
