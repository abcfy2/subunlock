[project]
name = "subunlock"
version = "0.1.0"
description = "从机场魔改客户端提取标准 Clash 订阅"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "cryptography>=44.0",
]

[project.scripts]
subunlock = "subunlock.cli:main"

[dependency-groups]
dev = ["ruff>=0.14", "basedpyright>=1.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subunlock"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Provider.configure_args 是可选的空实现(默认无参数), B027 不适用
"src/subunlock/base.py" = ["B027"]

[tool.basedpyright]
include = ["src", "main.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
